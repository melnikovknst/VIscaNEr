project_root: /Users/konstantinmelnikov/Desktop/work/VIscaNEr

# Inputs. All relative paths are resolved against project_root.
weights_path: models/dinov3/model.safetensors
crops_metadata_path: datasets/yolo_label_detector/crops/crops_metadata.csv
bottle_manifest_path: datasets/bottle_images_45k/bottle_images_manifest.csv
crops_root: datasets/yolo_label_detector/crops
refs_root: datasets/wine-scanner/data/refs/rgb

# Prepared index and outputs.
index_path: datasets/dinov3_retrieval/index.csv
split_summary_path: datasets/dinov3_retrieval/split_summary.json
models_dir: models/dinov3_retrieval
runs_dir: runs/dinov3_retrieval
run_name: dinov3_vitb16_wine_retrieval

# Reproducible, identity-safe split.
seed: 42
unseen_identity_fraction: 0.15
val_seen_per_identity: 2
include_low_confidence_in_train: false

# DINOv3 ViT-B/16 input and retrieval head.
image_size: 224
embedding_dim: 256
projection_hidden_dim: 512

# Stage 1 trains only the retrieval head. Stage 2 fine-tunes the last blocks.
stage1_epochs: 5
stage2_epochs: 12
stage1_identities_per_batch: 16
stage1_images_per_identity: 4
stage2_identities_per_batch: 8
stage2_images_per_identity: 2
unfreeze_last_blocks: 2

# Optimisation.
head_lr: 0.0003
backbone_lr: 0.00001
weight_decay: 0.05
supcon_temperature: 0.07
ce_temperature: 0.07
ce_weight: 0.5
patience: 5

# Runtime. `auto` selects CUDA, then MPS, then CPU.
device: auto
amp: true
num_workers: 4
eval_batch_size: 64
