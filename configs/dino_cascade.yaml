# Local evaluation of the production-style two-stage resolver.
# Relative paths are resolved from this file (configs/ -> project root).
project_root: ..

primary_checkpoint: models/trained_checkpoints/dinov3_vitb16_labels_best_full.pt
resolver_checkpoint: models/trained_checkpoints/dinov3_vits16_bottles_best_full.pt

label_metadata: datasets/dinov3_target_crops/crops_metadata.csv
bottle_metadata: datasets/bottle_classifier_crops/crops_metadata.csv
bottle_training_metadata: datasets/bottle_classifier_crops/training_metadata.csv
source_manifest: datasets/bottle_images_45k/bottle_images_manifest.csv
label_crops_root: datasets/dinov3_target_crops
bottle_crops_root: datasets/bottle_classifier_crops
label_refs_root: datasets/wine-scanner/data/refs/rgb
bottle_refs_root: datasets/bottle_classifier_crops/refs
output_dir: runs/dino_cascade

# The learned gate was trained on train, selected on val_seen, and is evaluated
# on val_unseen. It predicts expected DINO-S utility before DINO-S is called.
gating_strategy: learned
gate_model_path: models/cascade_gate/dino_s_gate.joblib
gate_max_margin: 0.03

# Raw cosine-similarity gap between the DINO-B Top-1 and Top-2 references.
# Used only when gating_strategy=margin. Selected on val_seen by
# tune_cascade_threshold.py; val_unseen remains evaluation-only.
ambiguity_margin: 0.01525

device: auto
# Conservative defaults for a 24 GB Apple Silicon Mac. Increase if desired.
primary_batch_size: 24
resolver_batch_size: 48
ranking_batch_size: 512
num_workers: 2
top_k: 10
seed: 42
unseen_identity_fraction: 0.15
val_seen_per_identity: 2
visualization_examples: 12
