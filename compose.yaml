services:
  winescanner:
    build:
      context: .
      args:
        TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/cu128}
    image: winescanner:latest
    container_name: winescanner
    ports:
      - "${PORT:-8080}:8080"
    env_file: .env                        # run.sh creates it from .env.example
    volumes:
      - history:/app/backend/data         # scan history of the web interface
      - huggingface:/cache/huggingface    # bge-m3 for the sommelier, downloaded once
    restart: unless-stopped

volumes:
  history:
  huggingface:
