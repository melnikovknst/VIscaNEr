project_root: /Users/konstantinmelnikov/Desktop/work/VIscaNEr

# Inputs. Kaggle notebook replaces these paths with attached read-only datasets.
weights_path: models/dinov3/model.safetensors
crops_metadata_path: datasets/dinov3_target_crops/crops_metadata.csv
bottle_manifest_path: datasets/bottle_images_45k/bottle_images_manifest.csv
crops_root: datasets/dinov3_target_crops
refs_root: datasets/wine-scanner/data/refs/rgb

index_path: datasets/dinov3_retrieval/index.csv
split_summary_path: datasets/dinov3_retrieval/split_summary.json
models_dir: models/dinov3_retrieval_full
runs_dir: runs/dinov3_retrieval
run_name: dinov3_vitb16_full_finetune

seed: 42
unseen_identity_fraction: 0.15
val_seen_per_identity: 2
include_low_confidence_in_train: false

image_size: 224
embedding_dim: 256
projection_hidden_dim: 512

# Fixed warm-up phases followed by full-backbone fine-tuning.
stage1_epochs: 5
stage2_epochs: 5
stage3_epochs: 100
stage1_identities_per_batch: 16
stage1_images_per_identity: 4
stage2_identities_per_batch: 8
stage2_images_per_identity: 2
unfreeze_last_blocks: 4

head_lr: 0.0003
backbone_lr: 0.00001
stage3_head_lr: 0.0001
stage3_backbone_lr: 0.000005
weight_decay: 0.05
supcon_temperature: 0.07
ce_temperature: 0.07
ce_weight: 0.5

# The global best checkpoint and stage-3 early stopping use unseen Recall@1.
patience: 6
early_stopping_split: val_unseen
early_stopping_metric: recall_at_1
stage3_patience: 12
stage3_min_epochs: 15
stage3_warmup_epochs: 3
max_session_hours: 10.5

device: auto
amp: true
num_workers: 4
eval_batch_size: 64
